# Production topology on one Hetzner VM (spec 14 §3.11, Q17): Caddy terminates TLS, the API and PostgreSQL stay on the
# private network, the Kokoro sidecar (ADR 0020) is reachable only from the API.
# Usage on the VM (infra/scripts/burdock-deploy.sh does this):
#   sops -d infra/secrets/prod.enc.env > /opt/burdock/.env
#   API_IMAGE_TAG=<tag> docker compose -f compose.yaml -f compose.prod.yaml up -d
services:
  caddy:
    image: caddy:2.10
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge, internal]
    depends_on:
      api:
        condition: service_healthy

  api:
    image: ghcr.io/sanya9b/burdock-api:${API_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Burdock: Host=postgres;Port=5432;Database=burdock;Username=burdock;Password=${POSTGRES_PASSWORD}
      Proxy__TrustedNetworks__0: 172.28.0.0/16
      Pronunciation__KokoroBaseUrl: http://kokoro:8081/
      Pronunciation__StorePath: /data/pronunciation
      Content__ObjectStore: S3
      Content__PublicBaseUrl: https://cdn.burdock.org/
      Content__S3__ServiceUrl: https://hel1.your-objectstorage.com
      Content__S3__Bucket: burdock-content
      Content__S3__Region: hel1
    volumes:
      - pronunciation-data:/data/pronunciation
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: burdock
      POSTGRES_USER: burdock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks: [internal]
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U burdock -d burdock"]
      interval: 10s
      timeout: 5s
      retries: 10

  kokoro:
    build:
      context: ../..
      dockerfile: infra/kokoro/Dockerfile
    image: burdock-kokoro:local
    restart: unless-stopped
    networks: [internal]
    environment:
      KOKORO_THREADS: "2"
    deploy:
      resources:
        limits:
          memory: 1500m

networks:
  edge:
  internal:
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  pronunciation-data:
