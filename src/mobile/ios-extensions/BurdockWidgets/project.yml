# XcodeGen spec of the widget extension (spec 04 §3.1.1). The .xcodeproj is generated on CI (`xcodegen generate`) and never
# committed: there is no Mac in the team, so this file is the source of truth. Info.plist and entitlements are generated too.
name: BurdockWidgets
options:
  bundleIdPrefix: org.burdock
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: 9XZ2FQC6B7
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_STRICT_CONCURRENCY: minimal
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
packages:
  BurdockShared:
    path: BurdockShared
targets:
  BurdockWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: BurdockWidgets
      - path: Shared/DesignTokens.swift
      # Two faces only (spec 04 §3.1.6): the word in Unbounded Bold, labels in Rubik Medium; the rest is the system font.
      - path: ../../Burdock.Presentation/Resources/Fonts/Unbounded-Bold.ttf
        buildPhase: resources
      - path: ../../Burdock.Presentation/Resources/Fonts/Rubik-Medium.ttf
        buildPhase: resources
    dependencies:
      - package: BurdockShared
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: AppIntents.framework
    info:
      path: BurdockWidgets/Info.plist
      properties:
        CFBundleDisplayName: Реп’ях
        CFBundleDevelopmentRegion: uk
        # Must match the containing app (App Store Connect warns on a mismatch); release-ios passes both build settings.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts:
          - Unbounded-Bold.ttf
          - Rubik-Medium.ttf
    entitlements:
      path: BurdockWidgets/BurdockWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.org.burdock.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.burdock.app.widgets
        PRODUCT_NAME: BurdockWidgets
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
  BurdockWidgetGallery:
    type: application
    platform: iOS
    sources:
      - path: BurdockWidgetGallery
      - path: BurdockWidgets/Views
      - path: BurdockWidgets/Intents
      - path: BurdockWidgets/Resources
      - path: Shared/DesignTokens.swift
      - path: ../../Burdock.Presentation/Resources/Fonts/Unbounded-Bold.ttf
        buildPhase: resources
      - path: ../../Burdock.Presentation/Resources/Fonts/Rubik-Medium.ttf
        buildPhase: resources
    dependencies:
      - package: BurdockShared
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: AppIntents.framework
    info:
      path: BurdockWidgetGallery/Info.plist
      properties:
        CFBundleDisplayName: Burdock Widget Gallery
        CFBundleDevelopmentRegion: uk
        UILaunchScreen: {}
        UIAppFonts:
          - Unbounded-Bold.ttf
          - Rubik-Medium.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.burdock.app.widgetgallery
        PRODUCT_NAME: BurdockWidgetGallery
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: NO
schemes:
  BurdockWidgets:
    build:
      targets:
        BurdockWidgets: all
  BurdockWidgetGallery:
    build:
      targets:
        BurdockWidgetGallery: all
    run:
      config: Release
