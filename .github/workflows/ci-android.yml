name: ci-android

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "design/tokens/**"
      - "Directory.*.props"
      - "global.json"
      - "Burdock.Mobile.slnx"
      - ".github/workflows/ci-android.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android app
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "21"

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android --skip-sign-check

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-android-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-android-${{ runner.os }}-

      - name: Build Presentation (net10.0-android, Release, unsigned)
        run: >
          dotnet build src/mobile/Burdock.Presentation/Burdock.Presentation.csproj
          -f net10.0-android -c Release
          -p:AndroidPackageFormat=apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: burdock-android-debugkey-apk
          path: src/mobile/Burdock.Presentation/bin/Release/net10.0-android/**/*-Signed.apk
          if-no-files-found: warn
