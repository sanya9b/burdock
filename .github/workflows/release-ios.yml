name: release-ios

# TestFlight release of the iOS app (spec 14 FR-14-5, section 3.6 "release-ios"): signed Release build for ios-arm64 and
# upload through the App Store Connect API key kept in the GitHub Environment `prod-ios` (manual approval by the owner).
# `dry_run` builds the same Release configuration unsigned and uploads nothing: it exists so the AOT/linker path for a
# real device can be checked before certificates exist. Runbook: docs/runbooks/release-ios.md.
on:
  push:
    tags: ["mobile/v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only build Release for ios-arm64 without signing or upload (no secrets needed)"
        type: boolean
        default: false
      display_version:
        description: "Marketing version (CFBundleShortVersionString); default: from the tag mobile/vX.Y.Z or the csproj"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-ios
  cancel-in-progress: false

env:
  # Keep in step with ci-ios.yml: .NET for iOS 26.5 (workload set 10.0.401) needs Xcode 26.6 on the macos-26 image.
  XCODE_PREFERRED: "26.6"
  WORKLOAD_SET: "10.0.401"
  PROJECT: src/mobile/Burdock.Presentation/Burdock.Presentation.csproj

jobs:
  dry-run:
    name: Release build for a device, unsigned (dry run)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          candidate="/Applications/Xcode_${XCODE_PREFERRED}.app"
          if [ ! -e "$candidate" ]; then echo "Xcode ${XCODE_PREFERRED} not found"; ls /Applications | grep -i xcode; exit 1; fi
          sudo xcode-select -s "$(realpath "$candidate")"
          xcodebuild -version

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install MAUI workloads (pinned set)
        run: dotnet workload install maui-ios maui-android --skip-sign-check --version "$WORKLOAD_SET"

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-ios-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-ios-${{ runner.os }}-

      - name: Build Release for ios-arm64 without code signing
        run: >
          dotnet build "$PROJECT"
          -f net10.0-ios -c Release
          -p:BurdockTargets=net10.0-ios
          -p:RuntimeIdentifier=ios-arm64
          -p:EnableCodeSigning=false
          -p:ApplicationVersion=${{ github.run_number }}

      - name: Report bundle size
        run: |
          app="$(find src/mobile/Burdock.Presentation/bin/Release/net10.0-ios/ios-arm64 -maxdepth 1 -name '*.app' | head -1)"
          echo "App bundle: $app"
          du -sh "$app"

  testflight:
    name: Build, sign and upload to TestFlight
    if: ${{ github.event_name == 'push' || !inputs.dry_run }}
    runs-on: macos-26
    environment: prod-ios
    timeout-minutes: 90
    env:
      KEYCHAIN_PATH: ${{ github.workspace }}/build.keychain-db
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          candidate="/Applications/Xcode_${XCODE_PREFERRED}.app"
          if [ ! -e "$candidate" ]; then echo "Xcode ${XCODE_PREFERRED} not found"; ls /Applications | grep -i xcode; exit 1; fi
          sudo xcode-select -s "$(realpath "$candidate")"
          xcodebuild -version

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install MAUI workloads (pinned set)
        run: dotnet workload install maui-ios maui-android --skip-sign-check --version "$WORKLOAD_SET"

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-ios-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-ios-${{ runner.os }}-

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.display_version }}
        run: |
          version="$INPUT_VERSION"
          if [ -z "$version" ] && [[ "$GITHUB_REF" == refs/tags/mobile/v* ]]; then
            version="${GITHUB_REF#refs/tags/mobile/v}"
          fi
          if [ -z "$version" ]; then
            version="$(sed -n 's:.*<ApplicationDisplayVersion>\(.*\)</ApplicationDisplayVersion>.*:\1:p' "$PROJECT" | head -1)"
          fi
          echo "display=$version" >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Version $version, build ${GITHUB_RUN_NUMBER}"

      - name: Import signing assets into a temporary keychain
        id: signing
        env:
          P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          for v in P12_BASE64 P12_PASSWORD PROFILE_BASE64; do
            if [ -z "${!v}" ]; then echo "Secret $v is empty; see docs/runbooks/release-ios.md"; exit 1; fi
          done
          keychain_password="$(openssl rand -hex 24)"
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          security import "$RUNNER_TEMP/distribution.p12" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$(security default-keychain -d user | tr -d ' "')"
          identity="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(Apple Distribution: .*\)"/\1/p' | head -1)"
          if [ -z "$identity" ]; then echo "No Apple Distribution identity in the imported .p12"; security find-identity -v -p codesigning "$KEYCHAIN_PATH"; exit 1; fi
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          profile_plist="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$RUNNER_TEMP/app.mobileprovision" > "$profile_plist"
          uuid="$(/usr/libexec/PlistBuddy -c 'Print UUID' "$profile_plist")"
          name="$(/usr/libexec/PlistBuddy -c 'Print Name' "$profile_plist")"
          app_id="$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' "$profile_plist")"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/app.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
          rm -f "$RUNNER_TEMP/distribution.p12"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "profile=$name" >> "$GITHUB_OUTPUT"
          echo "Signing with '$identity', profile '$name' ($app_id)"

      - name: Publish signed IPA
        env:
          DISPLAY_VERSION: ${{ steps.version.outputs.display }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
          CODESIGN_KEY: ${{ steps.signing.outputs.identity }}
          CODESIGN_PROVISION: ${{ steps.signing.outputs.profile }}
        run: >
          dotnet publish "$PROJECT"
          -f net10.0-ios -c Release
          -p:BurdockTargets=net10.0-ios
          -p:RuntimeIdentifier=ios-arm64
          -p:ArchiveOnBuild=true
          -p:ApplicationDisplayVersion="$DISPLAY_VERSION"
          -p:ApplicationVersion="$BUILD_NUMBER"
          -p:CodesignKey="$CODESIGN_KEY"
          -p:CodesignProvision="$CODESIGN_PROVISION"

      - name: Locate IPA and dSYM
        id: artifacts
        run: |
          set -euo pipefail
          ipa="$(find src/mobile/Burdock.Presentation/bin/Release/net10.0-ios/ios-arm64 -name '*.ipa' | head -1)"
          if [ -z "$ipa" ]; then echo "No .ipa produced"; find src/mobile/Burdock.Presentation/bin/Release/net10.0-ios -maxdepth 3 -print; exit 1; fi
          dsym="$(find src/mobile/Burdock.Presentation/bin/Release/net10.0-ios/ios-arm64 -maxdepth 2 -name '*.app.dSYM' | head -1)"
          echo "ipa=$ipa" >> "$GITHUB_OUTPUT"
          echo "dsym=$dsym" >> "$GITHUB_OUTPUT"
          ls -la "$ipa"

      - name: Upload to TestFlight (App Store Connect API key)
        env:
          IPA: ${{ steps.artifacts.outputs.ipa }}
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          for v in API_KEY_BASE64 API_KEY_ID API_ISSUER_ID; do
            if [ -z "${!v}" ]; then echo "Secret $v is empty; see docs/runbooks/release-ios.md"; exit 1; fi
          done
          mkdir -p "$HOME/private_keys"
          echo "$API_KEY_BASE64" | base64 --decode > "$HOME/private_keys/AuthKey_${API_KEY_ID}.p8"
          xcrun altool --validate-app --type ios --file "$IPA" --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID" --output-format normal
          xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID" --output-format normal
          rm -f "$HOME/private_keys/AuthKey_${API_KEY_ID}.p8"

      - name: Upload IPA and dSYM as run artifacts
        if: always() && steps.artifacts.outputs.ipa != ''
        uses: actions/upload-artifact@v4
        with:
          name: burdock-ios-${{ steps.version.outputs.display }}-${{ steps.version.outputs.build }}
          path: |
            ${{ steps.artifacts.outputs.ipa }}
            ${{ steps.artifacts.outputs.dsym }}
          retention-days: 30
          if-no-files-found: warn

      - name: Remove the temporary keychain and profile
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -f "$HOME/private_keys/"AuthKey_*.p8 2>/dev/null || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision 2>/dev/null || true
