name: ci-ios

# The only place iOS is built: the developer has no Mac (decision Q6/Q16). Simulator build first; device signing,
# the Swift widget extension and TestFlight upload are added in phase 3 (spec 14 section 3.6).
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "design/tokens/**"
      - "Directory.*.props"
      - "global.json"
      - "Burdock.Mobile.slnx"
      - ".github/workflows/ci-ios.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-simulator:
    name: Build iOS app (simulator)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        env:
          # .NET for iOS 26.5.10318 requires Xcode 26.6. Use the canonical app path: the Xcode_26.6.0.app alias made
          # xcrun report "MacOSX.sdk cannot be located" for actool (2026-09-27).
          XCODE_PREFERRED: "26.6"
        run: |
          ls -la /Applications | grep -i xcode || true
          candidate="/Applications/Xcode_${XCODE_PREFERRED}.app"
          if [ ! -e "$candidate" ]; then echo "Xcode ${XCODE_PREFERRED} not found"; exit 1; fi
          selected="$(realpath "$candidate")"
          echo "Selected $selected"
          sudo xcode-select -s "$selected"
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path
          xcrun --sdk macosx --find actool
          xcodebuild -showsdks | grep -E "iphonesimulator|macosx" || true

      - name: Workload versions
        run: dotnet --info | head -20

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install MAUI workloads (Infrastructure multi-targets android and ios on macOS)
        # Pinned workload set: 10.0.401 ships .NET for iOS 26.5.10318, which matches Xcode 26.6 on the macos-26 image.
        # The unpinned latest set moved to iOS 27.0.10722 (requires Xcode 27.0) on 2026-09-30 and broke the build.
        # Bump the set and XCODE_PREFERRED together once the runner image ships Xcode 27.
        run: dotnet workload install maui-ios maui-android --skip-sign-check --version 10.0.401

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-ios-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-ios-${{ runner.os }}-

      - name: Build Presentation (net10.0-ios, simulator, Debug)
        run: >
          dotnet build src/mobile/Burdock.Presentation/Burdock.Presentation.csproj
          -f net10.0-ios -c Debug
          -p:BurdockTargets=net10.0-ios
          -p:RuntimeIdentifier=iossimulator-arm64

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: burdock-ios-simulator-app
          path: src/mobile/Burdock.Presentation/bin/Debug/net10.0-ios/iossimulator-arm64/*.app
          if-no-files-found: warn
