name: ci-ios

# The only place iOS is built: the developer has no Mac (decision Q6/Q16). Simulator build first; device signing,
# the Swift widget extension and TestFlight upload are added in phase 3 (spec 14 section 3.6).
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "design/tokens/**"
      - "Directory.*.props"
      - "global.json"
      - "Burdock.Mobile.slnx"
      - ".github/workflows/ci-ios.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-simulator:
    name: Build iOS app (simulator)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode (newest 26.x with a complete SDK set)
        run: |
          ls /Applications | grep -i xcode || true
          selected=""
          for candidate in $(ls -d /Applications/Xcode_26*.app | sort -V -r); do
            if [ -d "$candidate/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk" ]                && [ -d "$candidate/Contents/Developer/Platforms/iPhoneSimulator.platform" ]; then
              selected="$candidate"; break
            fi
          done
          if [ -z "$selected" ]; then echo "No Xcode 26.x with macOS + iOS SDKs found"; exit 1; fi
          echo "Selected $selected"
          sudo xcode-select -s "$selected"
          xcodebuild -version
          xcodebuild -showsdks | grep -E "iphonesimulator|macosx" || true

      - name: Workload versions
        run: dotnet --info | head -20

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install MAUI workloads (Infrastructure multi-targets android and ios on macOS)
        run: dotnet workload install maui-ios maui-android --skip-sign-check

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-ios-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-ios-${{ runner.os }}-

      - name: Build Presentation (net10.0-ios, simulator, Debug)
        run: >
          dotnet build src/mobile/Burdock.Presentation/Burdock.Presentation.csproj
          -f net10.0-ios -c Debug
          -p:BurdockTargets=net10.0-ios
          -p:RuntimeIdentifier=iossimulator-arm64

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: burdock-ios-simulator-app
          path: src/mobile/Burdock.Presentation/bin/Debug/net10.0-ios/iossimulator-arm64/*.app
          if-no-files-found: warn
