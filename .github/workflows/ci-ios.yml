name: ci-ios

# The only place iOS is built: the developer has no Mac (decision Q6/Q16). Simulator build first; device signing,
# the Swift widget extension and TestFlight upload are added in phase 3 (spec 14 section 3.6).
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "design/tokens/**"
      - "Directory.*.props"
      - "global.json"
      - "Burdock.Mobile.slnx"
      - ".github/workflows/ci-ios.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-simulator:
    name: Build iOS app (simulator)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls /Applications | grep -i xcode || true
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios --skip-sign-check

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-ios-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-ios-${{ runner.os }}-

      - name: Build Presentation (net10.0-ios, simulator, Debug)
        run: >
          dotnet build src/mobile/Burdock.Presentation/Burdock.Presentation.csproj
          -f net10.0-ios -c Debug
          -p:RuntimeIdentifier=iossimulator-arm64

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: burdock-ios-simulator-app
          path: src/mobile/Burdock.Presentation/bin/Debug/net10.0-ios/iossimulator-arm64/*.app
          if-no-files-found: warn
